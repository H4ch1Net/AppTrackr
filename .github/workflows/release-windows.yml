name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: tag v<version> on this commit of main and create the GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import apptrackr; print(apptrackr.__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            Write-Error "Tag ${{ github.ref_name }} does not match apptrackr.__version__ ($version)"
            exit 1
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: python -m pytest

      - name: Build PyInstaller app
        run: pyinstaller --noconfirm packaging/apptrackr.spec

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/AppTrackr/AppTrackr.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Bundle self-test failed ($($p.ExitCode))"; exit 1 }

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path "dist/AppTrackr/*" -DestinationPath "dist/AppTrackr_Portable.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" "packaging/installer.iss"'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppTrackr-${{ steps.version.outputs.value }}
          path: |
            packaging/Output/AppTrackr_Setup.exe
            dist/AppTrackr_Portable.zip

      - name: Check release notes
        if: github.ref_type == 'tag' || (inputs.publish && github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          $notes = "docs/releases/${{ steps.version.outputs.value }}.md"
          if (-not (Test-Path $notes)) { Write-Error "Missing $notes (update steps shown on the release page)"; exit 1 }

      - name: Publish release
        if: github.ref_type == 'tag' || (inputs.publish && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: AppTrackr ${{ steps.version.outputs.value }}
          body_path: docs/releases/${{ steps.version.outputs.value }}.md
          files: |
            packaging/Output/AppTrackr_Setup.exe
            dist/AppTrackr_Portable.zip
          generate_release_notes: true
